name: Build & Release APK

on:
  push:
    branches: [main, codex/private-release-signing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build pull request without private signing credentials
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --console=plain

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/adb-watchdog-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --console=plain

      - name: Verify release certificate and non-debuggable APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > cert.txt
          cat cert.txt
          EXPECTED=$(tr -d '[:space:]' < .github/android-signing-certificate.sha256)
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' cert.txt)
          test "$ACTUAL" = "$EXPECTED"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > badging.txt
          if grep -q '^application-debuggable' badging.txt; then
            echo 'Refusing to distribute a debuggable APK' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/adb-watchdog-latest.apk

      - name: Remove any remaining temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/adb-watchdog-release.jks"

      - name: Upload verified signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: adb-watchdog-release-apk
          path: dist/adb-watchdog-latest.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: adb-watchdog-release-apk
          path: dist

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_SHA}"
          cat > release-notes.md <<'EOF'
          Signed release build using the new private signing key.
          Certificate SHA-256: 71cabefdfb51c81a15e6f34c93390229d963242a1c1df35bafe885bc0feb8ca5

          The old public debug signing key is compromised. If your installed
          version uses the old key, uninstall it first (this removes app data),
          install this release, and grant the permission again:
          adb shell pm grant com.luffy.adbwatchdog android.permission.WRITE_SECURE_SETTINGS
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" dist/adb-watchdog-latest.apk \
              --target "$GITHUB_SHA" --latest \
              --title "ADB Watchdog (${GITHUB_SHA::7})" \
              --notes-file release-notes.md
          fi
